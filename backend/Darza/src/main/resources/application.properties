spring.application.name=darza
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.web.error.include-message=always
app.search.page-size=12
app.storage.public-base-url=${BUCKET_URL}
app.storage.bucket-name=${STORAGE_BUCKET}
app.storage.supabase-url=${SUPABASE_URL}
app.storage.supabase-secret-key=${SUPABASE_SECRET_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.secret=${JWT_SECRET}
